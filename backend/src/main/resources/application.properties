spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/job_application_intelligence
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Session cookies remain usable over local HTTP. Set SESSION_COOKIE_SECURE=true when serving over HTTPS.
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.path=/
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax

# Local React development origin; override for the frontend origin used by the deployment.
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
